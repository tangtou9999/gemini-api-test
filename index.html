<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemini API 测试聊天</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1f2328;--mut:#6b7280;--pri:#2563eb;--ok:#16a34a;--err:#dc2626;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#111318;--card:#1b1e25;--tx:#e8eaed;--mut:#9aa0a6;--bd:#2c303a}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;height:100vh;height:100dvh}
.top{padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd)}
.row{display:flex;gap:6px;margin-top:6px}
input{flex:1;min-width:0;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px}
button{padding:9px 12px;border:0;border-radius:8px;background:var(--pri);color:#fff;font-size:14px}
button.g{background:var(--mut)}
button:disabled{opacity:.5}
#log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
.u{align-self:flex-end;background:var(--pri);color:#fff}
.a{align-self:flex-start;background:var(--card);border:1px solid var(--bd)}
.s{align-self:center;max-width:96%;font-size:13px;color:var(--mut);background:none}
.e{align-self:stretch;max-width:100%;background:rgba(220,38,38,.08);border:1px solid var(--err);color:var(--tx)}
.e b{color:var(--err)}
.k{align-self:stretch;max-width:100%;background:rgba(22,163,74,.1);border:1px solid var(--ok)}
.bar{display:flex;gap:6px;padding:10px 12px;background:var(--card);border-top:1px solid var(--bd)}
small{color:var(--mut)}
</style>
</head>
<body>
<div class="top">
  <b>Gemini API 测试</b> <small>（密钥只在本页使用，不会保存）</small>
  <div class="row"><input id="key" type="password" placeholder="粘贴你的 API Key（通常以 AIza 开头）" autocomplete="off"></div>
  <div class="row">
    <input id="model" value="gemini-2.5-flash" placeholder="模型名称">
    <button class="g" id="chk">一键检测</button>
  </div>
</div>
<div id="log"><div class="m s">① 粘贴 API Key → ② 点「一键检测」看密钥是否有效 → ③ 在下面发消息聊天。出错时我会用中文告诉你原因。</div></div>
<div class="bar"><input id="msg" placeholder="输入消息，例如：你好"><button id="send">发送</button></div>
<script>
const $=id=>document.getElementById(id),log=$('log');
const BASE='https://generativelanguage.googleapis.com/v1beta/';
let hist=[];
function add(t,c,html){const d=document.createElement('div');d.className='m '+c;if(html)d.innerHTML=t;else d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function explain(status,body,netErr){
  if(netErr){
    return `<b>❌ 请求没能发出去（网络层失败）</b><br>浏览器根本没连上谷歌服务器，还没到“密钥对不对”这一步。可能原因：<br>1. 当前网络访问不了 <code>generativelanguage.googleapis.com</code>（需要能访问谷歌的网络/VPN；开了 VPN 请确认是全局或该域名走代理）<br>2. 你是在 Claude 里的预览/发布页打开的——这类页面禁止访问外部网站。请把这个文件<b>下载后用手机/电脑浏览器直接打开</b>，或放到你自己的 GitHub Pages 上<br>3. 浏览器插件或防火墙拦截<br><small>原始信息：${esc(netErr)}</small>`;
  }
  const e=(body&&body.error)||{},msg=e.message||'',st=e.status||'';
  let why='';
  if(/location is not supported/i.test(msg)) why='<b>当前所在地区/出口 IP 不被 Gemini API 支持。</b>换一个受支持地区的网络（VPN 节点）再试。';
  else if(status===400&&(/API key not valid|API_KEY_INVALID/i.test(msg)||/API_KEY_INVALID/.test(JSON.stringify(e.details||''))))why='<b>API Key 无效。</b>可能复制错了（多了空格/少了字符）、已被删除，或者这不是 Gemini 的 Key。';
  else if(status===400&&/billing|free tier/i.test(msg))why='<b>该账号/地区无法使用免费额度，需要开通结算（billing）。</b>';
  else if(status===400)why='<b>请求格式有问题。</b>看下面原始信息。';
  else if(status===401)why='<b>身份验证失败。</b>Key 不对或缺失。';
  else if(status===403)why='<b>权限不足。</b>常见原因：该项目没有启用 Generative Language API；Key 被限制了来源/应用；Key 被封或泄露后被停用。建议到 Google AI Studio 重新创建一个 Key。';
  else if(status===404)why='<b>模型名称不存在或已下线。</b>点「一键检测」查看你的 Key 能用的模型，把其中一个名字填到“模型名称”框。';
  else if(status===429)why='<b>请求太多或额度用完（配额超限）。</b>等一会儿再试；如果一直这样，说明免费额度为 0 或已耗尽，需要检查配额/开通结算。';
  else if(status>=500)why='<b>谷歌服务器暂时出问题。</b>稍后重试，或换个模型。';
  else why='<b>未知错误。</b>';
  return `<b>❌ 失败（HTTP ${status}${st?' · '+esc(st):''}）</b><br>${why}<br><small>谷歌返回的原文：${esc(msg||JSON.stringify(body))}</small>`;
}

async function call(path,opt){
  const key=$('key').value.trim();
  if(!key){add('<b>⚠️ 还没填 API Key。</b>先在上面粘贴密钥。','e',1);return null}
  let r;
  try{r=await fetch(BASE+path,{...opt,headers:{'Content-Type':'application/json','x-goog-api-key':key}})}
  catch(err){add(explain(0,null,err.message||err),'e',1);return null}
  let j=null;try{j=await r.json()}catch(_){}
  if(!r.ok){add(explain(r.status,j),'e',1);return null}
  return j;
}

$('chk').onclick=async()=>{
  $('chk').disabled=true;add('正在检测…','s');
  const j=await call('models?pageSize=100');
  if(j){
    const names=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace('models/',''));
    add(`<b>✅ 密钥有效，能连上谷歌。</b><br>你的 Key 可用于聊天的模型有 ${names.length} 个，例如：<br>${esc(names.slice(0,12).join('、'))}<br><small>现在可以直接发消息试试；如果聊天报“模型不存在”，把上面某个名字填进“模型名称”。</small>`,'k',1);
  }
  $('chk').disabled=false;
};

async function send(){
  const t=$('msg').value.trim();if(!t)return;
  $('msg').value='';add(t,'u');hist.push({role:'user',parts:[{text:t}]});
  $('send').disabled=true;const w=add('思考中…','a');
  const j=await call('models/'+encodeURIComponent($('model').value.trim())+':generateContent',{method:'POST',body:JSON.stringify({contents:hist})});
  w.remove();
  if(j){
    const c=(j.candidates||[])[0];
    const txt=c&&c.content&&c.content.parts?c.content.parts.map(p=>p.text||'').join(''):'';
    if(txt){add(txt,'a');hist.push({role:'model',parts:[{text:txt}]})}
    else{hist.pop();const why=(j.promptFeedback&&j.promptFeedback.blockReason)?'内容被安全策略拦截（'+j.promptFeedback.blockReason+'）':'接口通了，但没有返回文字（结束原因：'+((c&&c.finishReason)||'未知')+'）';
      add(`<b>⚠️ ${esc(why)}</b><br><small>换一句话再试。</small>`,'e',1)}
  }else hist.pop();
  $('send').disabled=false;
}
$('send').onclick=send;
$('msg').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
